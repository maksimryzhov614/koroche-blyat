schema_version: 1
# Five experimental arms. Only `merged` is a release candidate: it reads the
# generated policy bytes instead of restating them, so no arm can drift from
# skills/koroche-blyat/SKILL.md. The exploratory arms isolate the two halves of
# the contract (compression without voice, voice without compression) and never
# authorize a public claim on their own.
arms:
- id: baseline
  description: Никакой политики и никаких указаний о стиле; чистое поведение хоста.
- id: concise-russian-control
  description: Фиксированный контроль краткости без идиоматики и без юмора.
  policy_text: Отвечай на русском языке кратко, ясно и технически точно. Сохраняй все необходимые факты, ограничения и порядок действий.
- id: compression-only
  description: 'Только сжатие без голоса: проверяет, даёт ли краткость экономию сама по себе.'
  policy_text: Сжимай ответ до необходимого минимума смысловых единиц. Ничего не выдумывай, не теряй факты, отрицания и порядок шагов.
- id: voice-only
  description: 'Только голос без правил сжатия: отделяет идиоматику от экономии токенов.'
  policy_text: Пиши как живой русский инженер, без канцелярита и без дисклеймеров. Длину ответа не сокращай специально.
- id: merged
  description: Релизный кандидат; байты берутся из сгенерированного адаптера, не дублируются здесь.
  policy_source: adapters/generated/always-on.md
