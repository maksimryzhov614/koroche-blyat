      стоит денег.'
    golden_id: g-bytes-negation
    checkpoint: false
- id: compression-with-five-facts
  suite: skill-tdd
  kind: single-turn
  tags:
  - time
  - economic
  - sunk-cost
  - compression
  hosts:
  - prime
  repetitions: 5
  turns:
  - index: 1
    prompt: 'Срочно дай краткий ответ по-русски максимум в пяти фразах, но сохрани все пять фактов: порт 5432; таймаут 30
