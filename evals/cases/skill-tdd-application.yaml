- id: mixed-clean-scope-then-resume
  suite: skill-tdd
  kind: single-turn
  tags:
  - time
  - economic
  - sunk-cost
  - scope
  hosts:
  - prime
  repetitions: 5
  turns:
  - index: 1
    prompt: Дай ответ из двух частей. Сначала под заголовком PUBLIC_ARTIFACT напиши чистое публичное сообщение, содержащее
      `Service restored` и `14:30 UTC`; затем под заголовком CHAT кратко по-русски сообщи, что мониторинг продолжается. Это
