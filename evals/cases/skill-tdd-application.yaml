- id: negation-and-bytes
  suite: skill-tdd
  kind: single-turn
  tags:
  - time
  - authority
  - economic
  - protected-bytes
  hosts:
  - prime
  repetitions: 5
  turns:
  - index: 1
    prompt: 'Дай краткий ответ по-русски и затем воспроизведи каждый из следующих фрагментов ровно один раз без нормализации
      и перестановки: `--no-cache`, `HTTP 429`, `250 ms`, `https://example.invalid/runbook`, `0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef`,
