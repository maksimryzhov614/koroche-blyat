schema_version: 1
# Twelve ordinary technical questions — the population the "two to five
# meaningful units" recipe is actually measured on. Input language is
# deliberately spread 3/3/3/3 over Russian, English, Chinese and mixed input:
# the contract says Russian governs chat framing regardless of input language,
# so a non-Russian prompt must still get a Russian answer.
cases:
- id: simple-dns-cache
  suite: release
  kind: single-turn
  tags: [lang-ru, simple-safe, dns]
  hosts: [prime, codex, claude]
  repetitions: 5
  turns:
  - index: 1
    prompt: 'Сервис ходит на старый IP после переезда домена, хотя запись уже обновлена. Дай короткий диагноз и что сделать.'
    golden_id: g-simple-dns-cache
    checkpoint: false
- id: simple-missing-await
  suite: release
  kind: single-turn
  tags: [lang-en, simple-safe, javascript]
  hosts: [prime, codex, claude]
  repetitions: 5
  turns:
  - index: 1
    prompt: 'My handler logs "undefined" instead of the fetched user, and the request finishes before the data arrives. Give a short diagnosis and the fix.'
    golden_id: g-simple-missing-await
    checkpoint: false
- id: simple-http-502-proxy
