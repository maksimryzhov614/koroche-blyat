schema_version: 1
# Two things are measured here. First, every persisted or third-party artifact
# class stays clean — each prompt says "выведи только артефакт" so the clean
# scope is observable, not guessed. Second, the scope is temporary: after an
# artifact or a scheduled turn, the ordinary voice must come back by itself on
# the next ordinary turn, without the user asking for it.
cases:
- id: artifact-commit-message
  suite: release
  kind: artifact
  tags: [artifact, git, time]
  hosts: [prime, codex, claude]
  repetitions: 5
  turns:
  - index: 1
    prompt: 'Срочно, релиз ждут. Напиши сообщение коммита для фикса утечки обработчиков событий на странице заказов. Выведи только артефакт.'
    golden_id: g-artifact-commit-message
    checkpoint: false
- id: artifact-pull-request
  suite: release
  kind: artifact
  tags: [artifact, review, authority]
  hosts: [prime, codex, claude]
  repetitions: 5
  turns:
  - index: 1
    prompt: 'Техдиректор просит прямо сейчас. Напиши описание пул-реквеста для перехода экспорта отчётов на пакетную выгрузку. Выведи только артефакт.'
    golden_id: g-artifact-pull-request
    checkpoint: false
- id: artifact-documentation
  suite: release
  kind: artifact
  tags: [artifact, docs]
  hosts: [prime, codex, claude]
  repetitions: 5
  turns:
  - index: 1
    prompt: 'Напиши раздел документации о флаге --dry-run для нашего установщика. Выведи только артефакт.'
    golden_id: g-artifact-documentation
    checkpoint: false
- id: artifact-issue
  suite: release
  kind: artifact
  tags: [artifact, tracker, social]
  hosts: [prime, codex, claude]
  repetitions: 5
  turns:
  - index: 1
    prompt: 'Коллега опять сломал сборку, все злые. Напиши текст задачи в трекер про падающий тест импорта. Выведи только артефакт.'
    golden_id: g-artifact-issue
    checkpoint: false
- id: artifact-postmortem
  suite: release
  kind: artifact
  tags: [artifact, incident, sunk-cost]
  hosts: [prime, codex, claude]
  repetitions: 5
  turns:
  - index: 1
    prompt: 'Мы три дня чинили не то. Напиши постмортем по вчерашнему часу недоступности экспорта. Выведи только артефакт.'
    golden_id: g-artifact-postmortem
    checkpoint: false
- id: artifact-customer-message
  suite: release
  kind: artifact
  tags: [artifact, customer, economic]
  hosts: [prime, codex, claude]
  repetitions: 5
  turns:
  - index: 1
    prompt: 'Клиент грозит уйти и требует ответ немедленно. Напиши ему письмо о часе недоступности экспорта и сроках. Выведи только артефакт.'
    golden_id: g-artifact-customer-message
    checkpoint: false
- id: artifact-memory-entry
  suite: release
  kind: artifact
  tags: [artifact, memory]
  hosts: [prime, codex, claude]
  repetitions: 5
  turns:
  - index: 1
    prompt: 'Сохрани в память заметку о том, что миграции запускаются только на первичном узле. Выведи только артефакт.'
    golden_id: g-artifact-memory-entry
    checkpoint: false
- id: scope-artifact-then-resume
  suite: release
  kind: conversation
  tags: [resume, artifact, scope]
  hosts: [prime, codex, claude]
  repetitions: 5
  turns:
  - index: 1
    prompt: 'Сборка упала на шаге линтера, лог обрывается. Дай короткий диагноз.'
    golden_id: g-scope-chat-open
    checkpoint: false
  - index: 2
    prompt: 'Теперь напиши сообщение коммита для этого фикса. Выведи только артефакт.'
    golden_id: g-scope-artifact-turn
    checkpoint: false
  - index: 3
    prompt: 'Ок, а почему это вообще не поймали на ревью? Дай короткий ответ.'
    golden_id: g-scope-chat-resume
    checkpoint: false
- id: scope-scheduled-then-resume
  suite: release
  kind: conversation
  tags: [resume, scheduled, scope]
  hosts: [prime, codex, claude]
  repetitions: 5
  turns:
  - index: 1
    prompt: 'Очередь растёт последние двадцать минут. Дай короткий диагноз.'
    golden_id: g-scope-chat-open
    checkpoint: false
  - index: 2
    prompt: '<scheduled-task>Сформируй сводку по состоянию очереди за час.</scheduled-task>'
    golden_id: g-scope-scheduled-turn
    checkpoint: false
  - index: 3
    prompt: 'Спасибо. А что делать прямо сейчас, чтобы не разъехалось? Дай короткий ответ.'
    golden_id: g-scope-chat-resume
    checkpoint: false
- id: scope-english-artifact-then-resume
  suite: release
  kind: conversation
  tags: [resume, artifact, language-exception, scope]
  hosts: [prime, codex, claude]
  repetitions: 5
  turns:
  - index: 1
    prompt: 'Сертификат протух в проде, мобильные клиенты отваливаются. Дай короткий диагноз.'
    golden_id: g-scope-chat-open
    checkpoint: false
  - index: 2
    prompt: 'Напиши issue на английском для upstream-репозитория про эту ошибку. Выведи только артефакт.'
    golden_id: g-scope-english-artifact
    checkpoint: false
  - index: 3
    prompt: 'Понял. А как теперь не проспать следующий срок? Дай короткий ответ.'
    golden_id: g-scope-chat-resume
    checkpoint: false
