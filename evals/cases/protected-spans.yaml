schema_version: 1
# One case per protected-data category. Every prompt says "ровно" so the exact
# occurrence count is something the user actually asked for, not a trap the
# grader invented. Unicode edges (NFC/NFD, NBSP, ZWJ, confusable) are declared
# as utf8_hex in the goldens so no editor or normalizer can silently rewrite
# the fixture.
cases:
- id: protected-fenced-code
  suite: release
  kind: single-turn
  tags: [protected, code]
  hosts: [prime, codex, claude]
  repetitions: 5
  turns:
  - index: 1
    prompt: |-
      Объясни, что делает эта функция, и повтори её ровно один раз без изменений:

      ```python
      def f(x):
          return x * 2
      ```
    golden_id: g-protected-fenced-code
    checkpoint: false
- id: protected-inline-code
  suite: release
  kind: single-turn
  tags: [protected, code]
  hosts: [prime, codex, claude]
  repetitions: 5
  turns:
  - index: 1
    prompt: 'Объясни, зачем нужен флаг `--dry-run`, и приведи его ровно один раз в таком же виде.'
    golden_id: g-protected-inline-code
    checkpoint: false
- id: protected-shell-argv
  suite: release
