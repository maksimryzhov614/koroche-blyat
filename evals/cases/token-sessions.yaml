schema_version: 1
# Paired token measurement at session lengths 1, 5 and 20. These carry no
# golden: they exist to compare token usage between arms on identical prompts,
# and behaviour is graded by the other suites. Turns form one coherent session
# so that later turns carry realistic context growth rather than restarting.
cases:
- id: token-session-01
  suite: release
  kind: token-session
  tags: [token-session, length-1]
  hosts: [prime, codex, claude]
  repetitions: 5
  turns:
  - index: 1
    prompt: 'Сервис отвечает 500 на каждый третий запрос после вчерашнего релиза. С чего начать?'
    golden_id: null
    checkpoint: false
- id: token-session-05
