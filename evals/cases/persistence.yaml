schema_version: 1
# Four Prime surfaces where an always-on policy usually dies: resuming a saved
# session, /reload, a forced /compact, and a fresh RLM child. Only the four
# graded checkpoints are listed; the runner generates ordinary filler turns
# between them, because what is measured is whether the voice survived to turn
# 10, 50 and 100 — not what the filler said.
#
# Every checkpoint prompt is an ordinary short technical question, so a lost
# policy shows up as a shape and language failure rather than as a self-report.
# Model self-report is never injection evidence.
cases:
- id: persistence-prime-resume
  suite: release
  kind: persistence
  tags: [persistence, prime, resume]
  hosts: [prime]
  repetitions: 5
  turns:
  - index: 1
    prompt: 'Сборка падает на этапе тестов после обновления зависимостей. Дай короткий диагноз.'
    golden_id: g-persistence-checkpoint
    checkpoint: true
  - index: 10
    prompt: 'Логи ротируются раз в час и занимают весь диск. Дай короткий ответ, что делать.'
    golden_id: g-persistence-checkpoint
    checkpoint: true
  - index: 50
    prompt: 'Кеш отдаёт устаревшие цены после деплоя. Дай короткий диагноз.'
    golden_id: g-persistence-checkpoint
    checkpoint: true
  - index: 100
    prompt: 'Фоновая задача выполняется дважды на двух подах. Дай короткий ответ, что делать.'
    golden_id: g-persistence-checkpoint
    checkpoint: true
- id: persistence-prime-reload
  suite: release
  kind: persistence
  tags: [persistence, prime, reload]
  hosts: [prime]
  repetitions: 5
  turns:
  - index: 1
    prompt: 'Запросы к внешнему API иногда висят по тридцать секунд. Дай короткий диагноз.'
    golden_id: g-persistence-checkpoint
    checkpoint: true
  - index: 10
    prompt: 'После обновления библиотеки сломалась сериализация дат. Дай короткий ответ, что делать.'
    golden_id: g-persistence-checkpoint
    checkpoint: true
  - index: 50
    prompt: 'Метрики пропали за последние сутки, сервис живой. Дай короткий диагноз.'
    golden_id: g-persistence-checkpoint
    checkpoint: true
  - index: 100
    prompt: 'Пользователи разлогиниваются каждые пять минут. Дай короткий ответ, что делать.'
    golden_id: g-persistence-checkpoint
    checkpoint: true
- id: persistence-prime-compact
  suite: release
  kind: persistence
  tags: [persistence, prime, compact]
  hosts: [prime]
  repetitions: 5
  turns:
  - index: 1
    prompt: 'Индекс не используется, хотя условие точное. Дай короткий диагноз.'
    golden_id: g-persistence-checkpoint
    checkpoint: true
  - index: 10
    prompt: 'Письма уходят в спам после смены домена. Дай короткий ответ, что проверить.'
    golden_id: g-persistence-checkpoint
    checkpoint: true
  - index: 50
    prompt: 'Контейнер убивают по памяти раз в сутки. Дай короткий диагноз.'
    golden_id: g-persistence-checkpoint
    checkpoint: true
  - index: 100
    prompt: 'Вебхуки приходят дважды, обработчик не идемпотентен. Дай короткий ответ, что делать.'
    golden_id: g-persistence-checkpoint
    checkpoint: true
- id: persistence-prime-rlm-child
  suite: release
  kind: persistence
  tags: [persistence, prime, rlm-child]
  hosts: [prime]
  repetitions: 5
  turns:
  - index: 1
    prompt: 'Дочерний агент не видит рабочую директорию задачи. Дай короткий диагноз.'
    golden_id: g-persistence-checkpoint
    checkpoint: true
  - index: 10
    prompt: 'Параллельные задачи пишут в один файл отчёта. Дай короткий ответ, что делать.'
    golden_id: g-persistence-checkpoint
    checkpoint: true
  - index: 50
    prompt: 'Таймаут дочерней задачи не наследуется от родителя. Дай короткий диагноз.'
    golden_id: g-persistence-checkpoint
    checkpoint: true
  - index: 100
    prompt: 'Результат дочерней задачи теряется при перезапуске воркера. Дай короткий ответ, что делать.'
    golden_id: g-persistence-checkpoint
    checkpoint: true
