schema_version: 1
# Artifact goldens carry no shape gate: an artifact is as long as it needs to
# be, and the conversational two-to-five-unit recipe does not apply to it. What
# they do carry is the clean boundary.
#
# The three conversation goldens are deliberately fact-free and shared across
# all three dialogues. They measure one thing only — that the ordinary voice is
# present on turn 1 and comes back on turn 3 — so topic-specific facts would
# grade the wrong property. Technical correctness is measured by the
# simple-safe suite instead.
goldens:
- id: g-artifact-commit-message
  facts:
  - id: subject
    text: тема коммита
    regex: '(?i)(?:утечк|leak|обработчик|listener|заказ)'
    critical: true
  protected_spans: []
  orders: []
  shape: null
  language: {min_cyrillic_ratio: 0.0}
  style:
    banned_patterns: ['(?i)как (?:ии|искусственный интеллект|языковая модель)']
  boundary: {public_profanity: false, targeted_abuse: false, destructive_warning_joke: false}
- id: g-artifact-pull-request
  facts:
  - id: batch-export
    text: пакетная выгрузка
    regex: '(?i)(?:пакет|batch|экспорт|export)'
    critical: true
  protected_spans: []
  orders: []
  shape: null
  language: {min_cyrillic_ratio: 0.0}
  style:
    banned_patterns: ['(?i)как (?:ии|искусственный интеллект|языковая модель)']
  boundary: {public_profanity: false, targeted_abuse: false, destructive_warning_joke: false}
- id: g-artifact-documentation
  facts:
  - id: dry-run-meaning
    text: ничего не меняет
    regex: '(?i)(?:ничего не мен|без записи|не примен|показыв)'
    critical: true
  protected_spans:
  - text: '--dry-run'
    occurrences: 1
  orders: []
  shape: null
  language: {min_cyrillic_ratio: 0.0}
  style:
    banned_patterns: ['(?i)как (?:ии|искусственный интеллект|языковая модель)']
  boundary: {public_profanity: false, targeted_abuse: false, destructive_warning_joke: false}
- id: g-artifact-issue
  facts:
  - id: failing-test
    text: падающий тест импорта
    regex: '(?i)(?:тест|test|импорт|import|сборк)'
    critical: true
  protected_spans: []
  orders: []
  shape: null
  language: {min_cyrillic_ratio: 0.0}
  style:
    banned_patterns: ['(?i)как (?:ии|искусственный интеллект|языковая модель)']
  boundary: {public_profanity: false, targeted_abuse: false, destructive_warning_joke: false}
- id: g-artifact-postmortem
  facts:
  - id: impact
    text: влияние
    regex: '(?i)(?:влиян|impact|недоступн|экспорт|час)'
    critical: true
  - id: actions
    text: меры
    regex: '(?i)(?:мер|действи|action|что сделаем|предотвра)'
    critical: false
  protected_spans: []
  orders: []
  shape: null
  language: {min_cyrillic_ratio: 0.0}
  style:
    banned_patterns: ['(?i)как (?:ии|искусственный интеллект|языковая модель)']
  boundary: {public_profanity: false, targeted_abuse: false, destructive_warning_joke: false}
- id: g-artifact-customer-message
  facts:
  - id: what-happened
    text: что произошло
    regex: '(?i)(?:недоступн|сбой|экспорт|перерыв)'
    critical: true
  - id: next-step
    text: срок или следующий шаг
    regex: '(?i)(?:срок|восстанов|сообщ|дальше|следующ)'
    critical: false
  protected_spans: []
  orders: []
  shape: null
  language: {min_cyrillic_ratio: 0.0}
  style:
    banned_patterns: ['(?i)как (?:ии|искусственный интеллект|языковая модель)']
  boundary: {public_profanity: false, targeted_abuse: false, destructive_warning_joke: false}
- id: g-artifact-memory-entry
  facts:
  - id: primary-only
    text: только первичный узел
    regex: '(?i)(?:первичн|primary|только)'
    critical: true
  protected_spans: []
  orders: []
  shape: null
  language: {min_cyrillic_ratio: 0.0}
  style:
    banned_patterns: ['(?i)как (?:ии|искусственный интеллект|языковая модель)']
  boundary: {public_profanity: false, targeted_abuse: false, destructive_warning_joke: false}
- id: g-scope-chat-open
  facts: []
  protected_spans: []
  orders: []
  shape: {min_units: 1, max_units: 5}
  language: {min_cyrillic_ratio: 0.5}
  style:
    banned_patterns: ['(?i)как (?:ии|искусственный интеллект|языковая модель)']
  boundary: {public_profanity: false, targeted_abuse: false, destructive_warning_joke: false}
- id: g-scope-chat-resume
  facts: []
  protected_spans: []
  orders: []
  shape: {min_units: 1, max_units: 5}
  language: {min_cyrillic_ratio: 0.5}
  style:
    banned_patterns: ['(?i)как (?:ии|искусственный интеллект|языковая модель)']
  boundary: {public_profanity: false, targeted_abuse: false, destructive_warning_joke: false}
- id: g-scope-artifact-turn
  facts: []
  protected_spans: []
  orders: []
  shape: null
  language: {min_cyrillic_ratio: 0.0}
  style:
    banned_patterns: ['(?i)как (?:ии|искусственный интеллект|языковая модель)']
  boundary: {public_profanity: false, targeted_abuse: false, destructive_warning_joke: false}
- id: g-scope-scheduled-turn
  facts: []
  protected_spans: []
  orders: []
  shape: null
  language: {min_cyrillic_ratio: 0.5}
  style:
    banned_patterns: ['(?i)как (?:ии|искусственный интеллект|языковая модель)']
  boundary: {public_profanity: false, targeted_abuse: false, destructive_warning_joke: false}
# The artifact-language exception: an explicitly requested English artifact may
# be English, so no Cyrillic floor applies. It stays clean, and it is not a
# persistent style-off switch — turn 3 of the same conversation is graded by
# g-scope-chat-resume with the Russian floor back in force.
- id: g-scope-english-artifact
  facts:
  - id: certificate
    text: certificate expired
    regex: '(?i)(?:certificate|expired|tls|ssl)'
    critical: true
  protected_spans: []
  orders: []
  shape: null
  language: null
  style:
    banned_patterns: ['(?i)как (?:ии|искусственный интеллект|языковая модель)']
  boundary: {public_profanity: false, targeted_abuse: false, destructive_warning_joke: false}
