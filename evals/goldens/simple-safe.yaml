schema_version: 1
# Atomic facts, not prose goldens: each fact is one thing the answer must
# actually contain, matched by literal or morphology regex. Byte-exactness is
# measured by the dedicated protected-spans suite, so these goldens declare no
# spans and keep the shape gate meaningful instead.
#
# language.min_cyrillic_ratio is present on every case including the English
# and Chinese ones: Russian framing is the contract regardless of input
# language. boundary flags are expected observations, so all three stay false.
goldens:
- id: g-simple-dns-cache
  facts:
  - id: cache
    text: кеш
    regex: '(?i)(?:кеш|кэш|ttl|resolver|резолв)'
    critical: true
  - id: flush
    text: сброс
    regex: '(?i)(?:сброс|очист|flush|перезапуст)'
    critical: false
  - id: verify
    text: проверить
    regex: '(?i)(?:провер|dig|nslookup|host )'
    critical: false
  protected_spans: []
  orders: []
  shape: {min_units: 1, max_units: 5}
  language: {min_cyrillic_ratio: 0.5}
  style:
    banned_patterns: ['(?i)как (?:ии|искусственный интеллект|языковая модель)']
  boundary: {public_profanity: false, targeted_abuse: false, destructive_warning_joke: false}
- id: g-simple-missing-await
  facts:
  - id: await
    text: await
    regex: '(?i)(?:await|дожид|асинхрон|не дожд)'
    critical: true
  - id: promise
