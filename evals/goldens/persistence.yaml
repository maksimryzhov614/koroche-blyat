schema_version: 1
# One shared checkpoint golden. Persistence measures survival of the framing,
# not the content of any particular answer, so topic facts would grade the
# wrong property — every checkpoint prompt is a different topic on purpose.
#
# A session that lost the policy answers these in long neutral prose: that
# fails the shape ceiling, and an English answer fails the Cyrillic floor.
goldens:
- id: g-persistence-checkpoint
  facts: []
  protected_spans: []
  orders: []
  shape: {min_units: 1, max_units: 5}
  language: {min_cyrillic_ratio: 0.5}
  style:
    banned_patterns: ['(?i)как (?:ии|искусственный интеллект|языковая модель)']
  boundary: {public_profanity: false, targeted_abuse: false, destructive_warning_joke: false}
