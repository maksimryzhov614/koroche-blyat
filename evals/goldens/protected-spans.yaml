schema_version: 1
# Byte-exact registries. Unicode edges are declared as utf8_hex precisely so
# the fixture cannot be normalized by an editor: 636166c3a9 is NFC café and
# 63616665cc81 is NFD café, and a grader that treats them as equal is broken.
# shape is null everywhere here — these cases measure fidelity, not concision.
goldens:
- id: g-protected-fenced-code
  facts:
  - id: doubles
    text: удваивает
    regex: '(?i)(?:удва|умнож|в два раза|\*\s*2)'
    critical: true
  protected_spans:
  - text: "```python\ndef f(x):\n    return x * 2\n```"
    occurrences: 1
  orders: []
  shape: null
  language: {min_cyrillic_ratio: 0.5}
  style:
    banned_patterns: ['(?i)как (?:ии|искусственный интеллект|языковая модель)']
  boundary: {public_profanity: false, targeted_abuse: false, destructive_warning_joke: false}
- id: g-protected-inline-code
  facts:
  - id: no-write
    text: без записи
    regex: '(?i)(?:без записи|ничего не мен|не примен|показыв|план)'
    critical: true
  protected_spans:
  - text: '--dry-run'
    occurrences: 1
  orders: []
  shape: null
  language: {min_cyrillic_ratio: 0.5}
  style:
    banned_patterns: ['(?i)как (?:ии|искусственный интеллект|языковая модель)']
  boundary: {public_profanity: false, targeted_abuse: false, destructive_warning_joke: false}
