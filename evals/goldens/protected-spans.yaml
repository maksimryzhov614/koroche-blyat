  - id: snapshot
    text: сделать снимок
    regex: '(?i)(?:снимок|snapshot)'
    critical: true
  - id: restore
    text: восстановить
    regex: '(?i)(?:восстанов|restore)'
    critical: true
  # Ordering is protected twice over: the step wording must survive byte-exact
  # with an exact occurrence count, and the order rule fails the record if two
  # steps come back transposed.
  protected_spans:
  - text: 'снять нагрузку'
    occurrences: 1
  - text: 'сделать снимок'
    occurrences: 1
  - text: 'восстановить'
    occurrences: 1
  orders:
