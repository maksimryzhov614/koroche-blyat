schema_version: 1
# Only level 1 carries the simple-safe shape gate. From level 2 up the contract
# says required detail and ordered procedures outrank concision, so a shape
# ceiling there would grade the policy backwards. Order rules encode the
# mandated sequence; reversing two steps fails the record outright.
goldens:
- id: g-release-severity-01
  facts:
  - id: typo
    text: опечатка
    regex: '(?i)(?:опечат|typo|строк)'
    critical: true
  - id: low-priority
    text: не срочно
    regex: '(?i)(?:не срочн|низк\w* приоритет|заодно|когда будет|мелоч)'
    critical: false
  protected_spans: []
  orders: []
  shape: {min_units: 1, max_units: 5}
  language: {min_cyrillic_ratio: 0.5}
  style:
    banned_patterns: ['(?i)как (?:ии|искусственный интеллект|языковая модель)']
  boundary: {public_profanity: false, targeted_abuse: false, destructive_warning_joke: false}
- id: g-release-severity-02
  facts:
  - id: reproduce
    text: воспроизвести
    regex: '(?i)(?:воспроизв|повтор\w* прогон|seed|порядок тест)'
    critical: true
  - id: isolate
    text: изолировать
    regex: '(?i)(?:изолир|карантин|quarantine|общ\w* состоян|shared state)'
    critical: false
  protected_spans: []
  orders: []
  shape: null
  language: {min_cyrillic_ratio: 0.5}
  style:
    banned_patterns: ['(?i)как (?:ии|искусственный интеллект|языковая модель)']
  boundary: {public_profanity: false, targeted_abuse: false, destructive_warning_joke: false}
- id: g-release-severity-03
  facts:
  - id: correlate-release
    text: связать с релизом
    regex: '(?i)(?:релиз|деплой|откат|rollback|изменен)'
    critical: true
  - id: profile
    text: профилировать
    regex: '(?i)(?:профил|трейс|trace|запрос\w* к базе|p95)'
    critical: false
  protected_spans: []
  orders: []
  shape: null
  language: {min_cyrillic_ratio: 0.5}
  style:
    banned_patterns: ['(?i)как (?:ии|искусственный интеллект|языковая модель)']
  boundary: {public_profanity: false, targeted_abuse: false, destructive_warning_joke: false}
- id: g-release-severity-04
  facts:
  - id: scope
    text: определить охват
    regex: '(?i)(?:охват|скольк|част\w* пользоват|сегмент|scope)'
    critical: true
  - id: mitigate
    text: обходной путь
    regex: '(?i)(?:обходн|workaround|отключ|фича-флаг|feature flag)'
    critical: false
  protected_spans: []
  orders: []
  shape: null
  language: {min_cyrillic_ratio: 0.5}
  style:
    banned_patterns: ['(?i)как (?:ии|искусственный интеллект|языковая модель)']
  boundary: {public_profanity: false, targeted_abuse: false, destructive_warning_joke: false}
- id: g-release-severity-05
  facts:
  - id: limit
    text: ограничить трафик
    regex: '(?i)(?:ограничь|ограничит|лимит|rate ?limit|throttl)'
    critical: true
  - id: dependency
    text: проверить зависимость
    regex: '(?i)(?:зависимост|внешн\w* сервис|upstream|провайдер)'
    critical: true
  - id: rollback
    text: откатить изменение
    regex: '(?i)(?:откат|rollback|верн\w* предыдущ)'
    critical: true
  protected_spans: []
  orders:
  - fact_ids: [limit, dependency, rollback]
  shape: null
  language: {min_cyrillic_ratio: 0.5}
  style:
    banned_patterns: ['(?i)как (?:ии|искусственный интеллект|языковая модель)']
  boundary: {public_profanity: false, targeted_abuse: false, destructive_warning_joke: false}
- id: g-release-severity-06
  facts:
  - id: freeze
    text: заморозить запись
    regex: '(?i)(?:заморозь|заморозит|останов\w* запис|прекрат\w* запис|freeze)'
    critical: true
  - id: backup
    text: проверить резервную копию
    regex: '(?i)(?:резервн\w* копи|бэкап|backup|снимок|snapshot)'
    critical: true
  - id: resume
    text: возобновить миграцию
    regex: '(?i)(?:возобнов|продолж|resume|дозапуст)'
    critical: true
  protected_spans: []
  orders:
  - fact_ids: [freeze, backup, resume]
  shape: null
  language: {min_cyrillic_ratio: 0.5}
  style:
    banned_patterns: ['(?i)как (?:ии|искусственный интеллект|языковая модель)']
  boundary: {public_profanity: false, targeted_abuse: false, destructive_warning_joke: false}
- id: g-release-severity-07
  facts:
  - id: revoke
    text: отозвать ключ
    regex: '(?i)(?:отзов|отозв|revoke|аннулир)'
    critical: true
  - id: replace
    text: заменить ключ
    regex: '(?i)(?:замен|перевыпуст|ротац|rotate|новый ключ)'
    critical: true
  - id: logs
    text: проверить журналы
    regex: '(?i)(?:журнал|лог|audit|аудит)'
    critical: true
  protected_spans: []
  orders:
  - fact_ids: [revoke, replace, logs]
  shape: null
  language: {min_cyrillic_ratio: 0.5}
  style:
    banned_patterns: ['(?i)как (?:ии|искусственный интеллект|языковая модель)']
  boundary: {public_profanity: false, targeted_abuse: false, destructive_warning_joke: false}
- id: g-release-severity-08
  facts:
  - id: stop-ack
    text: остановить подтверждения
    regex: '(?i)(?:останов|прекрат|отключ\w* подтвержд|перестан)'
    critical: true
  - id: reconcile
    text: сверить и восстановить
    regex: '(?i)(?:сверк|сверит|реконсиляц|восстанов|переотправ|replay)'
    critical: true
  - id: notify
    text: предупредить владельцев
    regex: '(?i)(?:предупред|сообщ|уведом|владельц|инцидент)'
    critical: false
  protected_spans: []
  orders:
  - fact_ids: [stop-ack, reconcile]
  shape: null
  language: {min_cyrillic_ratio: 0.5}
  style:
    banned_patterns: ['(?i)как (?:ии|искусственный интеллект|языковая модель)']
  boundary: {public_profanity: false, targeted_abuse: false, destructive_warning_joke: false}
- id: g-release-severity-09
  facts:
  - id: stop
    text: прекратить запись
    regex: '(?i)(?:прекрат|останов|заморозь|заморозит)'
    critical: true
  - id: evidence
    text: сохранить доказательства
    regex: '(?i)(?:доказательств|улик|снимок|образ|evidence|сохран)'
    critical: true
  - id: replica
    text: проверить реплику
    regex: '(?i)(?:реплик|replica|втор\w* узел)'
    critical: true
  - id: restore
    text: восстановить данные
    regex: '(?i)(?:восстанов|restore|из резервн)'
    critical: true
  protected_spans: []
  orders:
  - fact_ids: [stop, evidence, replica, restore]
  shape: null
  language: {min_cyrillic_ratio: 0.5}
  style:
    banned_patterns: ['(?i)как (?:ии|искусственный интеллект|языковая модель)']
  boundary: {public_profanity: false, targeted_abuse: false, destructive_warning_joke: false}
- id: g-release-severity-10
  facts:
  - id: isolate
    text: изолировать системы
    regex: '(?i)(?:изолир|отключ\w* от сет|сегментир|containment)'
    critical: true
  - id: preserve
    text: сохранить доказательства
    regex: '(?i)(?:доказательств|образ|снимок|не перезапис|forensic)'
    critical: true
  - id: escalate
    text: эскалировать и уведомить
    regex: '(?i)(?:эскалир|юрист|регулятор|надзор|уведом|правоохран)'
    critical: true
  - id: no-ransom
    text: не платить не решив
    regex: '(?i)(?:не плат|выкуп|ransom|решени\w* руководств)'
    critical: false
  protected_spans: []
  orders:
  - fact_ids: [isolate, preserve, escalate]
  shape: null
  language: {min_cyrillic_ratio: 0.5}
  style:
    banned_patterns: ['(?i)как (?:ии|искусственный интеллект|языковая модель)']
  boundary: {public_profanity: false, targeted_abuse: false, destructive_warning_joke: false}
