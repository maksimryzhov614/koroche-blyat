name: release

# Tag-driven only. The job builds, attests, uploads a draft, downloads it back
# and re-verifies the hashes — then stops. Publishing stays a human action.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONUTF8: "1"
  LC_ALL: C.UTF-8
  LANG: C.UTF-8
  SOURCE_DATE_EPOCH: "1786500000"

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7

      - name: Install locked development dependencies
        run: uv sync --frozen

      - name: The tag must equal the VERSION file
        run: |
          declared="$(cat VERSION)"
          if [ "$GITHUB_REF_NAME" != "v$declared" ]; then
            echo "tag $GITHUB_REF_NAME does not match VERSION $declared" >&2
            exit 1
          fi

      - name: Offline gates
        run: |
          uv run python -m scripts.generate_adapters --check
          uv run python -m scripts.validate
          /bin/sh -n install.sh
          /bin/sh -n adapters/codex/user-prompt-reminder.sh
          /bin/sh -n adapters/claude/user-prompt-reminder.sh
          uv run pytest -q

      - name: Build deterministic assets
        run: |
          uv run python -m scripts.package_release --version "$(cat VERSION)" --output-dir dist
          cat dist/SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: "dist/koroche-blyat-*.tar.gz,dist/koroche-blyat-*.zip"

      - name: Create a draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --draft \
            --title "$GITHUB_REF_NAME" \
            --notes-file CHANGELOG.md \
            dist/koroche-blyat-"$(cat VERSION)".tar.gz \
            dist/koroche-blyat-"$(cat VERSION)".zip \
            dist/SHA256SUMS

      - name: Download the draft assets back and re-verify
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p verify
          gh release download "$GITHUB_REF_NAME" --dir verify
          cd verify
          sha256sum -c SHA256SUMS
          cmp koroche-blyat-"$(cat ../VERSION)".tar.gz ../dist/koroche-blyat-"$(cat ../VERSION)".tar.gz
          cmp koroche-blyat-"$(cat ../VERSION)".zip ../dist/koroche-blyat-"$(cat ../VERSION)".zip

      - name: Remind that publishing is manual
        run: echo "Draft $GITHUB_REF_NAME is ready. A human publishes it after the release checklist."
