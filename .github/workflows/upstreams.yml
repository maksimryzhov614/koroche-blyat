name: upstreams

# Never runs on a pull request: it reaches the network, and a fork must not be
# able to trigger it. It reports pin drift and never edits a pin — changing a
# pinned commit is a human decision with a licence review attached.
on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upstreams
  cancel-in-progress: false

env:
  PYTHONUTF8: "1"
  LC_ALL: C.UTF-8
  LANG: C.UTF-8

jobs:
  upstreams:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7

      - name: Install locked development dependencies
        run: uv sync --frozen

      - name: Verify redistributed bytes offline
        run: uv run python -m scripts.check_upstreams

      - name: Verify pinned upstream commits online
        run: uv run python -m scripts.check_upstreams --online
