schema_version: 1
goldens:
  - id: golden-core
    facts:
      - id: fact-first
        text: Сначала
        regex: null
        critical: true
      - id: fact-second
        text: потом
        regex: "пот+ом"
        critical: false
    protected_spans:
      - text: "TypeError: Cannot read properties of undefined (reading 'map')"
        occurrences: 1
      - utf8_hex: "6974656d73"
        occurrences: 1
    orders:
      - fact_ids: [fact-first, fact-second]
    shape:
      min_units: 2
      max_units: 5
    language:
      min_cyrillic_ratio: 0.8
    style:
      banned_patterns: ["(?i)как языковая модель"]
    boundary:
      public_profanity: false
      targeted_abuse: false
      destructive_warning_joke: false
