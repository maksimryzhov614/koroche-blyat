
schema_version: 1
cases:
  - id: smoke-case
    suite: smoke
    kind: deterministic
    tags: [core]
    hosts: [cli]
    repetitions: 1
    turns:
      - index: 1
        prompt: Первый ответ.
        golden_id: golden-core
        checkpoint: true
      - index: 10
        prompt: Держи курс.
        golden_id: golden-core
        checkpoint: true
      - index: 50
        prompt: Почти готово.
        golden_id: golden-core
        checkpoint: true
      - index: 100
        prompt: Финал.
        golden_id: golden-core
        checkpoint: true
